<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Guest Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <a th:href="@{/organizer/events}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back to Events</a>
    <h1 class="mb-4">Guest Directory</h1>

    <div class="row">
        <!-- CREATE FORM -->
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Register New Guest</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/organizer/guests/add}" th:object="${newGuest}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" th:field="*{name}" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" th:field="*{email}" class="form-control" required />
                        </div>
                        <button type="submit" class="btn btn-success w-100">Add Guest</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- READ & DELETE LIST -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="guest : ${guests}">
                            <td th:text="${guest.id}"></td>
                            <td class="fw-bold" th:text="${guest.name}"></td>
                            <td th:text="${guest.email}"></td>
                            <td>
                                <!-- Edit Button -->
                                <a th:href="@{/organizer/guests/edit/{id}(id=${guest.id})}" class="btn btn-primary btn-sm">Edit</a>

                                <!-- Delete Button (Wrapped in a form for security) -->
                                <form th:action="@{/organizer/guests/delete/{id}(id=${guest.id})}" method="post" class="d-inline">
                                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure? This will remove all their invites too.');">Delete</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
