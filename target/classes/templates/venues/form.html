<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venue Form - EventCraft</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-container">
    <div th:replace="~{layout/sidebar :: sidebar('venues')}"></div>

    <main class="main-wrapper">
        <header class="top-header">
            <div class="header-greeting">
                <h1 th:text="${pageTitle}">Add New Venue</h1>
                <p>Enter venue details, address, capacity, and daily pricing rate.</p>
            </div>
            <a th:href="@{/venues}" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back to Venues</a>
        </header>

        <div class="card" style="max-width: 800px; margin: 0 auto;">
            <form th:action="@{/venues/save}" th:object="${venue}" method="post">
                <input type="hidden" th:field="*{venueId}" />

                <div class="form-group">
                    <label>Venue Name *</label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Grand Cinnamon Ballroom">
                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label>Street Address *</label>
                        <input type="text" th:field="*{street}" class="form-control" placeholder="e.g. 77 Galle Road">
                        <div class="field-error" th:if="${#fields.hasErrors('street')}" th:errors="*{street}"></div>
                    </div>
                    <div class="form-group">
                        <label>City *</label>
                        <input type="text" th:field="*{city}" class="form-control" placeholder="e.g. Colombo 03">
                        <div class="field-error" th:if="${#fields.hasErrors('city')}" th:errors="*{city}"></div>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label>Guest Capacity *</label>
                        <input type="number" th:field="*{capacity}" class="form-control" placeholder="e.g. 450">
                        <div class="field-error" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
                    </div>
                    <div class="form-group">
                        <label>Rate Per Day (LKR) *</label>
                        <input type="number" step="0.01" th:field="*{ratePerDay}" class="form-control" placeholder="e.g. 2500.00">
                        <div class="field-error" th:if="${#fields.hasErrors('ratePerDay')}" th:errors="*{ratePerDay}"></div>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select th:field="*{status}" class="form-control">
                            <option value="AVAILABLE">AVAILABLE</option>
                            <option value="BOOKED">BOOKED</option>
                            <option value="MAINTENANCE">MAINTENANCE</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" th:field="*{imageUrl}" class="form-control" placeholder="https://images.unsplash.com/photo-...">
                </div>

                <div class="form-group">
                    <label>Description &amp; Amenities</label>
                    <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Describe venue features, lighting, stage size, parking..."></textarea>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px;">
                    <a th:href="@{/venues}" class="btn-secondary">Cancel</a>
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Venue Listing</button>
                </div>
            </form>
        </div>
    </main>
</div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
