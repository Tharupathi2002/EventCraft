<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(${budget.id} != null ? 'Edit Budget' : 'New Budget')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title mb-3" th:text="${budget.id} != null ? 'Edit Budget' : 'Set a New Event Budget'"></h4>

                    <form th:action="${budget.id} != null ? @{/budgets/{id}(id=${budget.id})} : @{/budgets}"
                          th:object="${budget}" method="post">

                        <div class="mb-3" th:if="${budget.id} != null">
                            <label class="form-label">Event ID</label>
                            <input type="text" class="form-control" th:value="${budget.eventId}" disabled/>
                            <div class="form-text">Assigned automatically when the budget was created.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Event Name</label>
                            <input type="text" class="form-control" th:field="*{eventName}" placeholder="e.g. Sarah and Daniel's Wedding"/>
                            <div class="text-danger small" th:if="${#fields.hasErrors('eventName')}" th:errors="*{eventName}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Total Budget (LKR)</label>
                            <input type="number" step="0.01" min="0" class="form-control" th:field="*{totalBudget}" placeholder="10000.00"/>
                            <div class="text-danger small" th:if="${#fields.hasErrors('totalBudget')}" th:errors="*{totalBudget}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a class="btn btn-outline-secondary" th:href="@{/budgets}">Cancel</a>
                            <button type="submit" class="btn btn-primary" th:text="${budget.id} != null ? 'Save Changes' : 'Create Budget'"></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
