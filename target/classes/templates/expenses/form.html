<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead(${expense.id} != null ? 'Edit Expense' : 'Add Expense')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title mb-1" th:text="${expense.id} != null ? 'Edit Expense' : 'Add Expense'"></h4>
                    <p class="text-muted small mb-3" th:text="'For: ' + ${budget.eventName}"></p>

                    <form th:action="${expense.id} != null
                                ? @{/budgets/{bid}/expenses/{eid}(bid=${budget.id},eid=${expense.id})}
                                : @{/budgets/{bid}/expenses(bid=${budget.id})}"
                          th:object="${expense}" method="post">

                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <input type="text" class="form-control" th:field="*{description}" placeholder="e.g. Venue Deposit"/>
                            <div class="text-danger small" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" th:field="*{category}">
                                <option value="">Choose a category</option>
                                <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                            </select>
                            <div class="text-danger small" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Amount (LKR)</label>
                            <input type="number" step="0.01" min="0.01" class="form-control" th:field="*{amount}" placeholder="500.00"/>
                            <div class="text-danger small" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" th:field="*{expenseDate}"/>
                            <div class="text-danger small" th:if="${#fields.hasErrors('expenseDate')}" th:errors="*{expenseDate}"></div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a class="btn btn-outline-secondary" th:href="@{/budgets/{id}(id=${budget.id})}">Cancel</a>
                            <button type="submit" class="btn btn-primary" th:text="${expense.id} != null ? 'Save Changes' : 'Add Expense'"></button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
