# Application Name
spring.application.name=eventcraft-task-schedule

# Server Port (Reads from environment variable SERVER_PORT, defaults to 8080)
server.port=${SERVER_PORT:8080}

# Microsoft SQL Server DataSource Configuration via Environment Variables
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:EventCraftDB};encrypt=${DB_ENCRYPT:false};trustServerCertificate=${DB_TRUST_SERVER_CERT:true}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP Connection Pool Settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=UTC

# Logging
logging.level.com.eventcraft.taskschedule=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
