spring.application.name=budgetmanagement

# ---------------------------------------------------------------------------
# Database configuration -- Microsoft SQL Server
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:sqlserver://DESKTOP-I8II7C8\\SQLEXPRESS;databaseName=eventcraft_budget_db;encrypt=false;trustServerCertificate=true
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=sa
spring.datasource.password=1234$

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
# create-drop rebuilds the schema every run -- good while still designing
# tables. Switch to "update" once you want data to persist across restarts.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Optional: run against H2 in-memory instead (no SQL Server needed).
# Comment out the SQL Server block above and uncomment this block.
# ---------------------------------------------------------------------------
# spring.datasource.url=jdbc:h2:mem:eventcraft_budget_db;DB_CLOSE_DELAY=-1
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Thymeleaf
# ---------------------------------------------------------------------------
spring.thymeleaf.cache=false

# 8082 (not the common default 8080) so this module can run alongside other
# team members' standalone Spring Boot apps without a port clash.
server.port=8082
