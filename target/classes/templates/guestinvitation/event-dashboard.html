<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Event Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .cinema-container { background-color: #2b2b2b; padding: 20px; border-radius: 10px; color: white; }
        .screen { background-color: #fff; color: #000; text-align: center; padding: 5px; margin-bottom: 20px; font-weight: bold; border-radius: 5px; }
        .seat { width: 35px; height: 35px; margin: 3px; display: inline-flex; justify-content: center; align-items: center; border-radius: 5px; font-weight: bold; font-size: 0.7rem; }
        .available { background-color: #28a745; color: white; border: 2px solid #1e7e34; }
        .taken { background-color: #dc3545; color: white; }
        .row-container { display: flex; justify-content: center; margin-bottom: 5px; }
        .legend-box { width: 15px; height: 15px; display: inline-block; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
    </style>
</head>
<body class="bg-light">
<div class="container mt-5">
    <a th:href="@{/organizer/events}" class="btn btn-outline-secondary btn-sm mb-3">&larr; Back to Events</a>

    <div class="row">
        <!-- Left Column: Event Details & Invite Form -->
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${event.eventName} + ' Details'"></h4>
                </div>
                <div class="card-body">
                    <h5 class="card-title">Capacity</h5>
                    <p class="card-text">Total Seats: <span class="badge bg-secondary" th:text="${event.totalSeats}"></span></p>
                    <p class="card-text">Available: <span class="badge bg-success" th:text="${event.seatsAvailable}"></span></p>

                    <hr>

                    <h5 class="mb-3">Invite a Guest</h5>
                    <form th:action="@{/organizer/invite}" method="post" class="d-flex gap-2">
                        <input type="hidden" name="eventId" th:value="${event.id}" />
                        <select name="guestId" class="form-select form-select-sm">
                            <option th:each="user : ${availableUsers}" th:value="${user.id}" th:text="${user.name}"></option>
                        </select>
                        <button type="submit" class="btn btn-primary btn-sm">Invite</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Right Column: Guest List -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Invited Guests</h4>
                </div>
                <div class="card-body p-0">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr>
                            <th>Guest Name</th>
                            <th>RSVP Status</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="inv : ${invitations}">
                            <td class="fw-bold" th:text="${inv.guest.name}"></td>
                            <td>
                                <!-- Dynamic Badges -->
                                <span class="badge"
                                      th:classappend="${inv.rsvpStatus == 'ACCEPTED' ? 'bg-success' : (inv.rsvpStatus == 'DECLINED' ? 'bg-danger' : 'bg-warning text-dark')}"
                                      th:text="${inv.rsvpStatus}">
                                </span>
                            </td>
                            <td>
                                <!-- Cancel Invite Button -->
                                <form th:action="@{/organizer/invite/cancel}" method="post" class="m-0 d-inline">
                                    <input type="hidden" name="invitationId" th:value="${inv.id}" />
                                    <input type="hidden" name="eventId" th:value="${event.id}" />
                                    <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('Are you sure you want to revoke this invitation?');">Cancel Invite</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div> <!-- This closes the top row -->

    <!-- Bottom Row: Live Venue Seat Map -->
    <div class="row mt-4 mb-5">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Live Venue Map (Capacity: 40)</h4>
                </div>
                <div class="card-body bg-light">
                    <!-- The read-only Seat Grid -->
                    <div class="cinema-container mx-auto" style="max-width: 600px;">
                        <div class="screen">STAGE / SCREEN</div>

                        <div class="row-container" th:each="row : ${rows}">
                            <div th:each="col : ${cols}" th:with="seatId=${row + col}">
                                <div class="seat"
                                     th:classappend="${#lists.contains(takenSeats, seatId) ? 'taken' : 'available'}"
                                     th:title="${#lists.contains(takenSeats, seatId) ? 'Taken' : 'Available'}"
                                     th:text="${seatId}">
                                </div>
                            </div>
                        </div>

                        <!-- Legend -->
                        <div class="d-flex justify-content-center gap-4 mt-4">
                            <div><span class="legend-box bg-success"></span> Available</div>
                            <div><span class="legend-box bg-danger"></span> Taken</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
