<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="pageHead(title)">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title th:text="${title} + ' - EventCraft Budget'">EventCraft Budget</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link rel="stylesheet" th:href="@{/css/style.css}"/>
    </th:block>
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/budgets}">EventCraft Budget and Expenses</a>
            <div>
                <a class="btn btn-light btn-sm" th:href="@{/budgets/new}">New Budget</a>
            </div>
        </div>
    </nav>

    <div th:fragment="alerts" class="container">
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    </div>

    <div th:fragment="deleteConfirmModal" class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0" id="deleteConfirmItemName">Delete this item? This cannot be undone.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="deleteConfirmSubmitBtn">Confirm</button>
                </div>
            </div>
        </div>
    </div>
    <script th:fragment="deleteConfirmScript" th:inline="none">
        document.addEventListener('DOMContentLoaded', function () {
            var modalEl = document.getElementById('deleteConfirmModal');
            if (modalEl && typeof bootstrap !== 'undefined') {
                var modal = new bootstrap.Modal(modalEl);
                var nameEl = document.getElementById('deleteConfirmItemName');
                var submitBtn = document.getElementById('deleteConfirmSubmitBtn');
                var pendingFormId = null;

                document.querySelectorAll('.js-confirm-delete').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        pendingFormId = btn.getAttribute('data-form-id');
                        nameEl.textContent = btn.getAttribute('data-item-name') || 'Delete this item? This cannot be undone.';
                        modal.show();
                    });
                });

                submitBtn.addEventListener('click', function () {
                    if (pendingFormId) {
                        var form = document.getElementById(pendingFormId);
                        if (form) form.submit();
                    }
                    modal.hide();
                });
            }

            // Jumps to the Summary tab from a button that lives outside the
            // tab nav (e.g. the "unpaid expenses" banner). Triggering the
            // real nav-tabs button through the Bootstrap Tab API, rather
            // than putting data-bs-toggle on this standalone button, is
            // what makes the tab-switch actually work: Bootstrap's Tab
            // component only manages sibling active/inactive state for
            // triggers that live inside the same .nav container.
            if (typeof bootstrap !== 'undefined') {
                document.querySelectorAll('.js-go-to-summary-tab').forEach(function (btn) {
                    btn.addEventListener('click', function () {
                        var summaryTabLink = document.getElementById('summary-tab-link');
                        if (summaryTabLink) {
                            bootstrap.Tab.getOrCreateInstance(summaryTabLink).show();
                        }
                    });
                });
            }
        });
    </script>
</body>
</html>
